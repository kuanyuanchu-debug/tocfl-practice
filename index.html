const app=document.getElementById('app'),lang=document.getElementById('lang');function get(k,d){try{return JSON.parse(localStorage.getItem('tocfl2-'+k))??d}catch(e){return d}}function put(k,v){try{localStorage.setItem('tocfl2-'+k,JSON.stringify(v))}catch(e){}}lang.value=get('lang','zh');const t=i=>words[lang.value][i];let state=null,view='home';const cats=['all','grammar','vocab','reading','picture','listening'];const by=id=>bank[id-1];function mix(a){a=[...a];for(let j=a.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}function btn(id,txt,fn,primary=false){let b=document.createElement('button');b.id=id;b.textContent=txt;if(primary)b.className='primary';b.onclick=fn;app.append(b);return b}function save(){put('session',state)}function home(){view='home';app.innerHTML='<h2>'+t(0)+'</h2><label>'+t(7)+'<select id="count"><option>20</option><option>40</option><option>60</option></select></label><select id="cat">'+cats.map((c,i)=>'<option value="'+c+'">'+t(i+1)+' ('+(c==='all'?bank.length:bank.filter(q=>q.c===c).length)+')</option>').join('')+'</select><select id="mode"><option value="practice">'+t(8)+'</option><option value="exam">'+t(9)+'</option></select>';btn('start',t(10),()=>{let c=document.getElementById('cat').value;start(mix(bank.filter(q=>c==='all'||q.c===c)).slice(0,+document.getElementById('count').value),document.getElementById('mode').value)},true);let saved=get('session',null);if(saved&&saved.i<saved.ids.length)btn('resume',t(11),()=>{state=saved;show()});let wrong=get('wrong',[]);btn('wrong',t(12)+' ('+wrong.length+')',()=>start(mix(wrong.map(by).filter(Boolean)),'practice')).disabled=!wrong.length;btn('history',t(13),history);app.insertAdjacentHTML('beforeend','<small>'+t(20)+'</small>')}
function start(qs,mode){if(!qs.length)return;state={ids:qs.map(q=>q.id),i:0,answers:{},mode,start:Date.now(),order:qs.map(q=>mix([q.a,...q.w]))};save();show()}
function show(){view='quiz';let q=by(state.ids[state.i]),chosen=state.answers[q.id];app.innerHTML='<small>'+(state.i+1)+' / '+state.ids.length+'</small><progress max="'+state.ids.length+'" value="'+state.i+'"></progress>';if(q.info){let p=document.createElement('pre');p.textContent=q.info;app.append(p)}if(q.pic)app.insertAdjacentHTML('beforeend',q.pic);if(q.audio)btn('audio','▶ '+t(19),()=>{if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){alert(t(25));return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(q.audio);u.lang='zh-TW';u.rate=.85;u.onerror=()=>alert(t(25));speechSynthesis.speak(u)});let h=document.createElement('h2');h.textContent=q.q;app.append(h);state.order[state.i].forEach((v,j)=>{let b=btn('opt'+j,String.fromCharCode(65+j)+'. '+v,()=>{state.answers[q.id]=v;save();show()});if(chosen!==undefined){if(state.mode==='practice'){b.disabled=true;if(v===q.a)b.className='good';else if(v===chosen)b.className='bad'}else if(v===chosen)b.className='selected'}});if(chosen!==undefined&&state.mode==='practice'){let p=document.createElement('p');p.textContent=chosen===q.a?t(16):t(17)+'：'+q.a;app.append(p);if(q.audio){let p=document.createElement('small');p.textContent=q.audio;app.append(p)}}let next=btn('next',state.i===state.ids.length-1?t(15):t(14),()=>{if(window.speechSynthesis)speechSynthesis.cancel();state.i++;if(state.i===state.ids.length)finish();else{save();show()}},true);next.disabled=chosen===undefined;btn('home',t(18),()=>{if(window.speechSynthesis)speechSynthesis.cancel();home()})}
function finish(){view='result';let correct=state.ids.filter(id=>state.answers[id]===by(id).a).length;let score=Math.round(correct/state.ids.length*100),wrong=new Set(get('wrong',[]));state.ids.forEach(id=>state.answers[id]===by(id).a?wrong.delete(id):wrong.add(id));put('wrong',[...wrong]);let hist=get('history',[]);hist.unshift({date:new Date().toLocaleString(),score,n:state.ids.length,seconds:Math.round((Date.now()-state.start)/1000)});put('history',hist.slice(0,100));put('session',null);result()}
